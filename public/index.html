<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fifteen Tools - Fifteen AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: #0a0a0a;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(220,38,38,0.15), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(185,28,28,0.1), transparent 50%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(220,38,38,0.3);
    box-shadow: 0 4px 20px rgba(220,38,38,0.15);
  }

  .logo {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #dc2626, #ef4444, #f87171);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .company {
    font-size: 12px;
    color: #ef4444;
    opacity: 0.8;
    letter-spacing: 1px;
  }

  .container {
    display: flex;
    flex: 1;
    height: calc(100vh - 60px);
  }

  .sidebar {
    width: 220px;
    background: rgba(10,10,10,0.8);
    backdrop-filter: blur(10px);
    border-right: 1px solid rgba(220,38,38,0.2);
    padding: 15px 10px;
    overflow-y: auto;
  }

  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ef4444;
    margin-bottom: 12px;
    padding-left: 8px;
  }

  .ai-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }

  .ai-item:hover {
    background: rgba(220,38,38,0.1);
    border-color: rgba(220,38,38,0.3);
  }

  .ai-item.active {
    background: linear-gradient(90deg, rgba(220,38,38,0.25), rgba(153,27,27,0.15));
    border-color: #dc2626;
    box-shadow: 0 0 20px rgba(220,38,38,0.4);
  }

  .ai-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 2px solid rgba(220,38,38,0.3);
    background: linear-gradient(135deg,#dc2626,#991b1b);
  }

  .ai-info { display: flex; flex-direction: column; }
  .ai-name { font-weight: 600; font-size: 13px; }
  .ai-desc { font-size: 10px; color: #ef4444; opacity: 0.7; }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.4);
  }

  .chat-header {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(220,38,38,0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.5);
  }

  .chat-header .ai-avatar { width: 38px; height: 38px; font-size: 18px; }
  .chat-header h2 { font-size: 15px; }
  .chat-header p { font-size: 11px; color: #ef4444; opacity: 0.7; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .message.user .msg-avatar { 
    background: linear-gradient(135deg, #dc2626, #991b1b); 
    box-shadow: 0 0 15px rgba(220,38,38,0.5);
  }
  .message.ai .msg-avatar { 
    background: linear-gradient(135deg, #1f1f1f, #000);
    border: 1px solid rgba(220,38,38,0.4);
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
  }

  .message.user .msg-bubble {
    background: linear-gradient(135deg, #dc2626, #991b1b);
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(220,38,38,0.3);
  }

  .message.ai .msg-bubble {
    background: rgba(20,20,20,0.9);
    border: 1px solid rgba(220,38,38,0.25);
    border-bottom-left-radius: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .typing span {
    width: 6px; height: 6px;
    background: #dc2626;
    border-radius: 50%;
    animation: bounce 1.4s infinite;
    box-shadow: 0 0 8px rgba(220,38,38,0.8);
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    padding: 14px 20px;
    border-top: 1px solid rgba(220,38,38,0.2);
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.5);
  }

  .input-area input {
    flex: 1;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid rgba(220,38,38,0.3);
    background: rgba(20,0,0,0.5);
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
  }

  .input-area input:focus {
    border-color: #dc2626;
    box-shadow: 0 0 20px rgba(220,38,38,0.4);
  }

  .input-area input::placeholder { color: rgba(239,68,68,0.5); }

  .send-btn {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(220,38,38,0.6);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb {
    background: rgba(220,38,38,0.5);
    border-radius: 4px;
  }

  @media (max-width: 600px) {
    .sidebar { width: 70px; padding: 15px 6px; }
    .sidebar h3, .ai-info { display: none; }
    .ai-item { justify-content: center; padding: 8px; }
    .message { max-width: 95%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ Fifteen Tools</div>
  <div class="company">FIFTEEN AI</div>
</header>

<div class="container">
  <aside class="sidebar">
    <h3>ИИ Модели</h3>
    <div id="aiList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div class="ai-avatar" id="headerAvatar">🤖</div>
      <div>
        <h2 id="headerName">ChatGPT</h2>
        <p id="headerDesc">онлайн</p>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" maxlength="2000">
      <button class="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
    </div>
  </main>
</div>

<script>
const aiModels = [
  { id: 'chatgpt', name: 'ChatGPT', desc: 'OpenAI', icon: '🟢' },
  { id: 'claude', name: 'Claude', desc: 'Anthropic', icon: '🟣' },
  { id: 'gemini', name: 'Gemini', desc: 'Google', icon: '🔵' },
  { id: 'grok', name: 'Grok', desc: 'xAI', icon: '⚫' },
  { id: 'deepseek', name: 'DeepSeek', desc: 'DeepSeek AI', icon: '🐋' },
  { id: 'copilot', name: 'Copilot', desc: 'Microsoft', icon: '🟦' },
  { id: 'mistral', name: 'Mistral', desc: 'Mistral AI', icon: '🟠' },
  { id: 'perplexity', name: 'Perplexity', desc: 'Perplexity AI', icon: '🌀' }
];

let currentAI = aiModels[0];
const chats = {};

function init() {
  const list = document.getElementById('aiList');
  aiModels.forEach(ai => {
    const div = document.createElement('div');
    div.className = 'ai-item';
    div.dataset.id = ai.id;
    div.innerHTML = `
      <div class="ai-avatar">${ai.icon}</div>
      <div class="ai-info">
        <div class="ai-name">${ai.name}</div>
        <div class="ai-desc">${ai.desc}</div>
      </div>
    `;
    div.onclick = () => selectAI(ai);
    list.appendChild(div);
    chats[ai.id] = [];
  });
  selectAI(aiModels[0]);
}

function selectAI(ai) {
  currentAI = ai;
  document.querySelectorAll('.ai-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === ai.id);
  });
  document.getElementById('headerName').textContent = ai.name;
  document.getElementById('headerDesc').textContent = ai.desc + ' • онлайн';
  const av = document.getElementById('headerAvatar');
  av.textContent = ai.icon;
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  const history = chats[currentAI.id];
  if (history.length === 0) {
    addMessage('ai', `Привет! Я ${currentAI.name}. Чем могу помочь?`, false);
    return;
  }
  history.forEach(m => addMessage(m.role, m.text, false));
  container.scrollTop = container.scrollHeight;
}

function addMessage(role, text, save = true) {
  const container = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'message ' + role;

  const avatar = role === 'user' 
    ? '<div class="msg-avatar">👤</div>' 
    : `<div class="msg-avatar">${currentAI.icon}</div>`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  msg.innerHTML = avatar;
  msg.appendChild(bubble);
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;

  if (save) {
    chats[currentAI.id].push({ role, text });
  }
}

function showTyping() {
  const container = document.getElementById('messages');
  const msg = document.createElement('div');
  msg.className = 'message ai';
  msg.id = 'typingIndicator';
  msg.innerHTML = `
    <div class="msg-avatar">${currentAI.icon}</div>
    <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMessage('user', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        message: text, 
        model: currentAI.id 
      })
    });

    const data = await res.json();
    hideTyping();

    if (data.error) {
      addMessage('ai', '⚠️ Ошибка: ' + data.error);
    } else {
      addMessage('ai', data.reply);
    }
  } catch (err) {
    hideTyping();
    addMessage('ai', '⚠️ Не удалось связаться с сервером');
    console.error(err);
  }
}

function generateReply(userText) {
  const replies = {
    chatgpt: [
      `Отличный вопрос! Как ChatGPT, я помогу. Ты написал: "${userText}".`,
      `Обработал запрос: "${userText}". Вот что думаю...`,
      `Спасибо за сообщение! ChatGPT на связи.`
    ],
    claude: [
      `Здравствуй! Claude здесь. Ты написал: "${userText}".`,
      `Интересно! Я Claude от Anthropic.`,
      `Понимаю вопрос. Как Claude, отвечу подробно.`
    ],
    gemini: [
      `Привет! Gemini от Google на связи.`,
      `Запрос принят. Gemini готов помочь!`,
      `Отличный запрос! Я Gemini.`
    ],
    grok: [
      `Йоу! Grok тут. "${userText}" — забавно.`,
      `Ха, интересный вопрос. Grok отвечает!`,
      `Я Grok от xAI.`
    ],
    deepseek: [
      `DeepSeek готов! Анализирую: "${userText}".`,
      `Запрос обработан. DeepSeek AI.`,
      `Отличный вопрос! DeepSeek поможет.`
    ],
    copilot: [
      `Microsoft Copilot на связи!`,
      `Привет! Copilot готов ассистировать.`,
      `Я Copilot от Microsoft.`
    ],
    mistral: [
      `Mistral AI приветствует!`,
      `Быстро и точно: Mistral обработал.`,
      `Salut! Я Mistral.`
    ],
    perplexity: [
      `Perplexity ищет ответ...`,
      `Ищу актуальную информацию!`,
      `Я Perplexity.`
    ]
  };
  const arr = replies[currentAI.id] || [`Ответ от ${currentAI.name}`];
  return arr[Math.floor(Math.random() * arr.length)];
}

document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

init();
</script>
</body>
  </html>
